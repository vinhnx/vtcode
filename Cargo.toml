vtcode-ui = { path = "crates/codegen/vtcode-ui", version = "0.158.1" }
vtcode-indexer = { path = "crates/codegen/vtcode-indexer", version = "0.158.1" }
vtcode-bash-runner = { path = "crates/codegen/vtcode-bash-runner", version = "0.158.1" }
