vtcode-auth = { path = "crates/codegen/vtcode-auth", version = "0.158.1" }
vtcode-core = { path = "crates/codegen/vtcode-core", version = "0.158.1", default-features = false }
vtcode-webmcp = { path = "crates/codegen/vtcode-webmcp", version = "0.158.1" }
vtcode-agent-plugins = { path = "crates/common/vtcode-agent-plugins", version = "0.158.1" }
vtcode-memory = { path = "crates/codegen/vtcode-memory", version = "0.158.1" }
vtcode-eval = { path = "crates/codegen/vtcode-eval", version = "0.158.1" }
anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
webbrowser = { workspace = true }
tokio-util = { workspace = true, features = ["compat"] }
serde = { workspace = true }
toml = { workspace = true }
futures = { workspace = true }
itertools = { workspace = true }
memchr = { workspace = true }
tempfile = { workspace = true }
once_cell = { workspace = true }
chrono = { workspace = true } # For timestamp handling in CLI
uuid = { workspace = true, features = ["v4"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
