[package]
name = "vtcode"
version = "0.158.1"
edition = "2024"
rust-version = "1.93.0"
authors = ["Vinh Nguyen <vinhnguyen2308@gmail.com>"]
description = "A Rust-based terminal coding agent with modular architecture supporting multiple LLM providers"
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://github.com/vinhnx/vtcode"
repository = "https://github.com/vinhnx/vtcode"
documentation = "https://docs.rs/vtcode"
keywords = ["ai", "coding", "agent", "llm", "cli"]
categories = ["command-line-utilities", "development-tools", "api-bindings"]
exclude = [
    "target/",
    ".github/",
    "docs/**",
    "!docs/config/CONFIG_FIELD_REFERENCE.md",
    "scripts/",
    "screenshots/",
    "logs/",
    "/prompts/",
    "dist/",
    "npm/",
    "resources/",
]
default-run = "vtcode"

[lints]
workspace = true

# Override sections to consolidate duplicate dependencies
[workspace.dependencies]
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
base64 = "0.23.0"
crossterm = "0.29"
schemars = "1.2"
thiserror = "2.0.18"
unicode-width = "0.2.0"
rio-vt = "0.5.0"
serde_json = "1.0"
tempfile = "3.27"
tokio = { version = "1.52", features = ["full"] }
tokio-stream = "0.1"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive", "rc"] }
regex = "1.12"
num_cpus = "1.16"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
libc = "0.2"
nix = "0.31"
rand = "0.10"
semver = "1.0"
fs2 = "0.4"
hashbrown = { version = "0.17", features = ["serde"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
rustc-hash = "2.1"
keyring-core = "1"
libloading = "0.9"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
compact_str = { version = "0.10", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
assert_fs = "1.1"
futures = "0.3"
http = "1"
once_cell = "1.21"
indexmap = { version = "2.13", features = ["serde"] }
async-trait = "0.1.89"
anstyle = "1.0"
arc-swap = "1.9"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
ratatui-cheese = "0.7"
toml = "1.0.6"
sha2 = "0.11"
anstyle-git = "1.1"
tokio-util = "0.7"
tracing-subscriber = "0.3"
criterion = "0.8"
serde-saphyr = "1.1.0"
serial_test = "3.5"
dotenvy = "0.15"
strsim = "0.11"
dirs = "6.0"
smallvec = "1.13"
path-clean = "1.0"
shell-words = "1.1"
dialoguer = "0.12.0"
dunce = "1.0"
itertools = "0.15.0"
memchr = "2.8"
url = "2.5"
hotpath = "0.24"
agent-client-protocol = { version = "=2.0.0", features = ["unstable_auth_methods"] }
uuid = "1.23.2"
ignore = "0.4"
ring = "0.17"
pretty_assertions = "1.4"
proc-macro2 = "1"
quote = "1"
syn = "3"
linkme = "0.3"
webbrowser = "1.2"
tiktoken = "4.1"
opentelemetry = { version = "0.32", default-features = false, features = ["trace", "metrics"] }
